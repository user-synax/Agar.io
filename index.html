<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Agar.io</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <canvas id="gameCanvas"></canvas>
        <div id="dangerOverlay"></div>
        <div id="score">Score:</div>
        <div id="highScore">Best: 0</div>
        <div id="leaderboard"></div>
        <div id="deathScreen" class="hidden">
            <h1>Game Over</h1>
            <p id="finalScore">Score: 0</p>
            <button id="restartBtn">Play Again</button>
        </div>
        <div id="lobbyScreen">
            <div class="lobby-container">
                <h1>Blob.io</h1>

                <div class="lobby-stats">
                    <div>Coins: <span id="lobbyCoins">0</span></div>
                    <div>Best Score: <span id="lobbyHighScore">0</span></div>
                    <div>
                        Games Played: <span id="lobbyGamesPlayed">0</span>
                    </div>
                </div>

                <h2>Skins</h2>
                <div id="skinGrid"></div>

                <button id="playBtn">Play</button>
            </div>
        </div>
        <div id="dashStatus">Dash: Ready</div>
        <script src="script.js"></script>
    </body>
</html>
